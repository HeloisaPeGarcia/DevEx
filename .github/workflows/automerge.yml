name: Auto Merge on Validation Success

on:
  workflow_run:
    workflows: ["Validate Configs"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto Merge Pull Request
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          PR_NUM="$PR_NUMBER"
          
          # Fallback: If pull_requests list is empty, search via GitHub CLI by commit SHA
          if [ -z "$PR_NUM" ]; then
            echo "Pull request number not found directly in event payload. Querying GitHub API..."
            PR_NUM=$(gh pr list --state open --json number,headRefOid --jq ".[] | select(.headRefOid == \"$SHA\") | .number" | head -n 1)
          fi
          
          if [ -n "$PR_NUM" ]; then
            echo "Found open Pull Request #$PR_NUM for commit SHA $SHA."
            echo "Merging Pull Request #$PR_NUM..."
            gh pr merge "$PR_NUM" --merge --delete-branch
          else
            echo "No open Pull Request found associated with commit SHA $SHA."
          fi
